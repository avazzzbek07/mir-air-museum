  --body: "Golos Text", "Segoe UI", system-ui, sans-serif;

* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
body { font-family: var(--body); font-size: 15px; line-height: 1.55; }
a { color: var(--cyan); }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }

#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; z-index: 0; pointer-events: none; outline: none; }
body.free #scene { pointer-events: auto; touch-action: none; cursor: grab; }
body.free #scene:active { cursor: grabbing; }
body.free { overflow: hidden; }
#track { position: relative; z-index: 1; pointer-events: none; }
body.page #scene, body.page #track, body.page .museum-ui { display: none !important; }
.ui { position: fixed; z-index: 5; }

/* ---------- top bar ---------- */
.topbar {
  top: 0; left: 0; right: 0; height: calc(var(--bar) + env(safe-area-inset-top, 0px));
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding-top: env(safe-area-inset-top, 0px);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  z-index: 8; border-bottom: 1px solid transparent; transition: background .3s, border-color .3s;
}
body.page .topbar { background: var(--glass); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-bottom-color: var(--line); }
.brand { display: flex; align-items: baseline; gap: 10px; text-decoration: none; color: var(--ink); min-width: 0; }
.brand b { font-family: var(--display); font-weight: 400; font-size: 26px; letter-spacing: 0.12em; }
.brand span { font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold); white-space: nowrap; }
.nav { display: flex; gap: 2px; align-items: center; }
.nav a { font: 500 11.5px/1 var(--mono); letter-spacing: .05em; text-transform: uppercase; color: var(--ink); text-decoration: none; padding: 9px 9px; border-radius: 999px; white-space: nowrap; }
.nav a:hover { color: var(--cyan); }
.nav a[aria-current="page"] { background: var(--cyan); color: var(--bg); }
.nav a.acct { border: 1px solid var(--gold); color: var(--gold); }
.nav a.acct[aria-current="page"] { background: var(--gold); color: var(--bg); }
.controls { display: flex; gap: 8px; align-items: center; }
.langs { display: inline-flex; gap: 2px; padding: 3px; border: 1px solid var(--line); border-radius: 999px; background: var(--glass); }
.langs button { font: 500 11px/1 var(--mono); color: var(--ink-soft); background: none; border: 0; border-radius: 999px; padding: 7px 8px; cursor: pointer; }
.langs button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.btn {
  font: 500 12px/1 var(--mono); letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--ink); background: var(--glass); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border: 1px solid var(--line); border-radius: 999px; padding: 11px 14px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
}
.btn:hover { color: var(--cyan); border-color: var(--cyan); }
.btn.solid { background: var(--cyan); color: var(--bg); border-color: var(--cyan); }
.btn.solid:hover { background: #8ae4f1; color: var(--bg); }
.btn.gold { border-color: var(--gold); color: var(--gold); }
.btn.danger { border-color: var(--bad); color: var(--bad); }
.btn:disabled { opacity: .5; cursor: progress; }
.menu-btn { display: none; }
body.page .walk { display: none; }

/* ---------- museum overlay ---------- */
.intro { left: 0; bottom: 17vh; max-width: 800px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); transition: opacity .5s, transform .5s; text-shadow: 0 0 30px rgba(8,10,20,.95); }
.eyebrow { font: 500 11px/1.4 var(--mono); letter-spacing: 0.18em; text-transform: uppercase; color: var(--gold); }
.intro h1 { margin: 10px 0 0; font-family: var(--display); font-weight: 400; font-size: clamp(46px, 9vw, 118px); line-height: 0.92; text-wrap: balance; }
.intro h1 em { display: block; font-style: normal; color: var(--cyan); letter-spacing: 0.16em; font-size: 0.56em; margin-top: 0.18em; text-shadow: 0 0 24px rgba(95,212,230,.45); }
.intro p { max-width: 52ch; margin: 18px 0 0; color: var(--ink-soft); font-size: 16px; }
.intro .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; text-shadow: none; }
.intro.gone, .hint.gone { opacity: 0; transform: translateY(16px); pointer-events: none; }
.hint { left: 50%; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); font: 500 11px/1 var(--mono); letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-soft); display: flex; flex-direction: column; align-items: center; gap: 10px; transition: opacity .4s; }
.hint.gone { transform: translate(-50%, 16px); }
.hint i { width: 1px; height: 34px; background: linear-gradient(var(--cyan), transparent); animation: drip 1.8s ease-in-out infinite; }
@keyframes drip { 0%{ transform: scaleY(.2); transform-origin: top } 50%{ transform: scaleY(1); transform-origin: top } 100%{ transform: scaleY(.2); transform-origin: bottom } }
.card { background: var(--glass); backdrop-filter: blur(18px) saturate(1.2); -webkit-backdrop-filter: blur(18px) saturate(1.2); border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 20px 60px -30px rgba(0,0,0,.8); }
.panel { left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); width: min(410px, calc(100% - 32px)); padding: 20px 22px 18px; opacity: 0; transform: translateY(18px); transition: opacity .45s, transform .45s; pointer-events: none; }
.panel.on { opacity: 1; transform: none; pointer-events: auto; }
.panel.right { left: auto; right: max(56px, calc(env(safe-area-inset-right, 0px) + 40px)); }
.panel h2 { margin: 8px 0 10px; font-family: var(--display); font-weight: 400; font-size: 31px; line-height: 1.05; text-wrap: balance; }
.panel p { margin: 0; color: var(--ink-soft); }
.ptop { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.ptoggle { font: 500 10.5px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--cyan); background: none; border: 0; padding: 4px 0; cursor: pointer; white-space: nowrap; }
.specs { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 14px 0 0; padding-top: 12px; border-top: 1px solid var(--line); font-size: 13px; }
.specs dt { font: 500 10.5px/1.9 var(--mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-soft); }
.specs dd { margin: 0; min-width: 0; }
.pacts { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 14px; }
.panel.mini { padding: 14px 16px; }
.panel.mini #pDesc, .panel.mini .specs { display: none; }
.panel.mini h2 { font-size: 24px; margin: 6px 0 0; }
.panel.mini .pacts { margin-top: 10px; }
.final { left: 50%; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); width: min(600px, calc(100% - 32px)); padding: 22px; text-align: center; opacity: 0; transform: translate(-50%, 18px); transition: opacity .5s, transform .5s; pointer-events: none; }
.final.on { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
.final h2 { margin: 6px 0 4px; font-family: var(--display); font-weight: 400; font-size: 30px; text-wrap: balance; }
.final p { margin: 0 0 14px; color: var(--ink-soft); }
.final .row { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.rail { right: max(16px, env(safe-area-inset-right, 0px)); top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 2px; }
.rail button { width: 26px; height: 22px; border: 0; background: none; cursor: pointer; display: grid; place-items: center; padding: 0; }
.rail button::before { content: ""; width: 6px; height: 6px; transform: rotate(45deg); background: rgba(236,233,246,.3); transition: transform .3s, background .3s; }
.rail button.on::before { background: var(--gold); transform: rotate(45deg) scale(1.7); box-shadow: 0 0 10px var(--gold); }
body.free .rail, body.free .hint, body.free .intro { opacity: 0; pointer-events: none; }
.freehelp { left: 50%; top: calc(var(--bar) + 10px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); padding: 9px 14px; font: 500 11px/1.4 var(--mono); letter-spacing: .06em; color: var(--ink-soft); text-align: center; max-width: calc(100% - 32px); }
.pad { left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); display: grid; grid-template-columns: repeat(3, 54px); grid-template-rows: repeat(2, 54px); gap: 6px; }
.pad button { border-radius: 50%; font-size: 18px; padding: 0; touch-action: none; user-select: none; -webkit-user-select: none; }
.pad [data-k="f"] { grid-column: 2; grid-row: 1; } .pad [data-k="l"] { grid-column: 1; grid-row: 2; } .pad [data-k="b"] { grid-column: 2; grid-row: 2; } .pad [data-k="r"] { grid-column: 3; grid-row: 2; }
.loader { inset: 0; display: grid; place-items: center; background: var(--bg); z-index: 20; transition: opacity .8s; font: 500 12px/1 var(--mono); letter-spacing: .18em; text-transform: uppercase; color: var(--gold); }
.loader.done { opacity: 0; pointer-events: none; }
.err { max-width: 40ch; text-align: center; line-height: 1.6; text-transform: none; letter-spacing: 0; font-family: var(--body); font-size: 15px; color: var(--ink); }

/* ---------- reading pages ---------- */
#page { display: none; position: relative; z-index: 2; }
body.page #page { display: block; }
body.page { background: radial-gradient(1200px 600px at 85% -10%, rgba(95,212,230,.08), transparent 60%), radial-gradient(900px 500px at -10% 10%, rgba(224,178,90,.06), transparent 60%), var(--bg); background-attachment: fixed; }
.wrap { max-width: 1140px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: calc(var(--bar) + 40px) 64px; display: flex; flex-direction: column; gap: 56px; }
.head { display: flex; flex-direction: column; gap: 12px; max-width: 72ch; }
.head h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(40px, 6vw, 70px); line-height: 1; text-wrap: balance; }
.head p { margin: 0; color: var(--ink-soft); font-size: 17px; }
.head::after, h2.sec::after { content: ""; display: block; height: 28px; width: 336px; max-width: 100%; background: var(--orn) repeat-x left center / 56px 28px; opacity: .95; filter: drop-shadow(0 0 6px rgba(224,178,90,.35)); }
h2.sec { margin: 0; font-family: var(--display); font-weight: 400; font-size: 34px; line-height: 1.1; text-wrap: balance; display: flex; flex-direction: column; gap: 8px; }
h2.sec::after { width: 224px; height: 24px; background-size: 48px 24px; }
section.block { display: flex; flex-direction: column; gap: 18px; }
.lede { max-width: 66ch; color: var(--ink-soft); margin: 0; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
.grid.two { grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 20px; display: flex; flex-direction: column; gap: 8px; }
.tile h3 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 24px; line-height: 1.1; }
.tile p { margin: 0; color: var(--ink-soft); }
.stats { display: flex; flex-wrap: wrap; gap: 28px 48px; padding-top: 18px; border-top: 1px solid var(--line); }
.stat b { display: block; font-family: var(--display); font-weight: 400; font-size: 48px; line-height: 1; color: var(--cyan); font-variant-numeric: tabular-nums; }
.stat span { font: 500 11px/1.4 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-soft); }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); counter-reset: s; }
.steps li { counter-increment: s; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 18px; display: flex; flex-direction: column; gap: 6px; }
.steps li::before { content: counter(s, decimal-leading-zero); font: 500 12px/1 var(--mono); color: var(--gold); letter-spacing: .1em; }
.steps b { font-weight: 600; } .steps span { color: var(--ink-soft); }

/* forms and filters */
.filters { display: flex; flex-wrap: wrap; gap: 12px 18px; align-items: end; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > label, .field > .lbl { font: 500 10.5px/1.2 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-soft); }
.field input, .field select, .field textarea { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; min-width: 0; width: 100%; }
.field textarea { resize: vertical; min-height: 110px; }
.field.grow { flex: 1 1 240px; }
.field .hintx { font-size: 12.5px; color: var(--ink-soft); }
.check { display: flex; gap: 10px; align-items: center; font-size: 14px; cursor: pointer; }
.check input { width: 18px; height: 18px; accent-color: var(--cyan); }
.seg { display: inline-flex; flex-wrap: wrap; gap: 4px; }
.seg button { font: 500 11.5px/1 var(--mono); letter-spacing: .04em; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 8px 11px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.count { font: 500 12px/1 var(--mono); color: var(--ink-soft); }
.form { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
.form .full { grid-column: 1 / -1; }
.note { font-size: 13px; color: var(--ink-soft); margin: 0; }
.banner { border: 1px solid var(--line); border-left: 3px solid var(--gold); background: var(--surface); border-radius: 6px; padding: 14px 16px; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; }
.banner.ok { border-left-color: var(--ok); } .banner.bad { border-left-color: var(--bad); } .banner.info { border-left-color: var(--cyan); }
.tabs { display: inline-flex; gap: 4px; border-bottom: 1px solid var(--line); }
.tabs button { font: 500 12px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-soft); background: none; border: 0; border-bottom: 2px solid transparent; padding: 12px 14px; cursor: pointer; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--cyan); }
.authbox { max-width: 460px; display: flex; flex-direction: column; gap: 16px; }
.thumbrow { display: flex; gap: 8px; flex-wrap: wrap; }
.thumbrow img { width: 96px; height: 72px; object-fit: cover; border-radius: 4px; border: 1px solid var(--line); }

/* project cards */
.pcard { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; display: flex; flex-direction: column; color: var(--ink); text-decoration: none; transition: border-color .2s, transform .2s, box-shadow .2s; position: relative; }
.pcard:hover { border-color: var(--cyan); transform: translateY(-2px); box-shadow: 0 0 0 1px rgba(95,212,230,.25), 0 18px 40px -24px rgba(95,212,230,.5); }
.pimg { aspect-ratio: 4 / 3; background: #10173a; overflow: hidden; position: relative; max-width: 100%; }
.pimg img { width: 100%; height: 100%; object-fit: cover; display: block; }
.blueprint { position: absolute; inset: 0; display: grid; place-items: center; color: rgba(236,233,246,.92); font-family: var(--display); font-size: 30px; text-align: center; padding: 16px; text-shadow: 0 0 18px rgba(95,212,230,.6);
  background: var(--orn) repeat-x left 50% bottom 14px / 36px 18px, var(--orn) repeat-x left 50% top 14px / 36px 18px,
    radial-gradient(circle at 50% 50%, rgba(95,212,230,.16), transparent 65%),
    linear-gradient(rgba(95,212,230,.12) 1px, transparent 1px) 0 0 / 20px 20px, linear-gradient(90deg, rgba(95,212,230,.12) 1px, transparent 1px) 0 0 / 20px 20px, #10173a; }
.pbody { padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
.pbody h3 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 23px; line-height: 1.12; text-wrap: balance; }
.pbody p { margin: 0; color: var(--ink-soft); font-size: 14px; }
.pmeta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.pfoot { margin-top: auto; display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 13px; color: var(--ink-soft); }
.chip { font: 500 10.5px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; border: 1px solid currentColor; border-radius: 999px; padding: 5px 8px; white-space: nowrap; }
.st-work, .st-pending { color: var(--warn); } .st-demo, .st-approved { color: var(--ok); } .st-best { color: var(--gold); } .st-idea { color: var(--cyan); } .st-rejected { color: var(--bad); }
.gchip { font: 500 10.5px/1 var(--mono); letter-spacing: .05em; color: var(--ink-soft); background: rgba(236,233,246,.07); border-radius: 999px; padding: 5px 8px; }
.tags { display: flex; flex-wrap: wrap; gap: 4px; }
.tags span { font: 400 11px/1 var(--mono); color: var(--ink-soft); border: 1px solid var(--line); border-radius: 3px; padding: 4px 6px; }
.likebtn { font: 500 12px/1 var(--mono); color: var(--ink); background: rgba(236,233,246,.06); border: 1px solid var(--line); border-radius: 999px; padding: 7px 10px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; font-variant-numeric: tabular-nums; }
.likebtn:hover { border-color: var(--gold); color: var(--gold); }
.likebtn[aria-pressed="true"] { color: var(--bg); background: var(--gold); border-color: var(--gold); }
.likebtn svg { width: 14px; height: 14px; }
.empty { padding: 28px; text-align: center; color: var(--ink-soft); border: 1px dashed var(--line); border-radius: 6px; }
.rank { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); counter-reset: r; }
.rank a { counter-increment: r; display: grid; grid-template-columns: auto 64px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 14px 10px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; text-decoration: none; color: var(--ink); }
.rank a:hover { border-color: var(--gold); }
.rank a::before { content: counter(r); font: 400 26px/1 var(--display); color: var(--gold); width: 22px; text-align: center; }
.rank img, .rank .ph { width: 64px; height: 48px; object-fit: cover; border-radius: 4px; background: #10173a; }
.rank b { font-weight: 500; font-size: 14px; line-height: 1.3; }
.rank span { font: 500 12px/1 var(--mono); color: var(--gold); font-variant-numeric: tabular-nums; }

/* project page */
.back { font: 500 12px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; text-decoration: none; }
.proj { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 36px; align-items: start; }
.gallery { display: flex; flex-direction: column; gap: 8px; }
.gallery .main { width: 100%; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); aspect-ratio: 4 / 3; object-fit: contain; }
.thumbs { display: flex; gap: 8px; flex-wrap: wrap; }
.thumbs button { padding: 0; border: 1px solid var(--line); border-radius: 4px; background: none; cursor: pointer; width: 76px; height: 57px; overflow: hidden; }
.thumbs button[aria-pressed="true"] { border-color: var(--cyan); outline: 1px solid var(--cyan); }
.thumbs img { width: 100%; height: 100%; object-fit: cover; display: block; }
.facts { display: flex; flex-direction: column; gap: 14px; }
.ptitle { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(34px, 4.6vw, 52px); line-height: 1.04; text-wrap: balance; }
.story { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
.kv { width: 100%; border-collapse: collapse; font-size: 14px; }
.kv th, .kv td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
.kv thead th { font: 500 10.5px/1.4 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-soft); }
.kv tbody th { width: 34%; font-weight: 600; } .kv td { color: var(--ink-soft); }
.scroll-x { overflow-x: auto; }
pre.code { margin: 0; background: #05060d; color: #e9e7f2; border: 1px solid var(--line); border-radius: 6px; padding: 18px; font: 13px/1.6 var(--mono); overflow-x: auto; }

/* students */
.scard { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 16px; display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 14px; text-decoration: none; color: var(--ink); align-items: start; }
.scard:hover { border-color: var(--cyan); }
.ava { width: 72px; height: 72px; border-radius: 50%; object-fit: cover; background: #10173a; border: 1px solid var(--gold); display: grid; place-items: center; font: 400 26px/1 var(--display); color: var(--gold); overflow: hidden; }
.ava.big { width: 168px; height: 168px; font-size: 56px; }
.scard h3 { margin: 0 0 4px; font-family: var(--display); font-weight: 400; font-size: 22px; line-height: 1.1; }
.scard p { margin: 4px 0 0; font-size: 13.5px; color: var(--ink-soft); }
.badge { display: inline-block; font: 500 10.5px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--bg); background: var(--ok); border-radius: 999px; padding: 5px 8px; }
.person { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 28px; align-items: center; }
.clinks { display: flex; flex-wrap: wrap; gap: 8px; }

/* groups */
.gcard { text-decoration: none; color: var(--ink); } .gcard:hover { border-color: var(--cyan); }
.gcard .big { font-family: var(--display); font-size: 52px; line-height: 1; color: var(--cyan); }
.squad { display: flex; flex-direction: column; gap: 14px; }
.squad h3 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 26px; }
.team h4 { margin: 0 0 6px; font: 500 12px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--gold); }
.members { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.members li { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.members li:last-child { border-bottom: 0; }
.members a { color: var(--ink); text-decoration-color: var(--cyan); }
.members .role { font: 400 11px/1.6 var(--mono); color: var(--ink-soft); text-align: right; }
.lead { color: var(--gold); font-weight: 600; }
.flatlist { columns: 3 220px; column-gap: 28px; margin: 0; padding-left: 22px; font-size: 14px; }
.flatlist li { padding: 3px 0; break-inside: avoid; }
.flatlist a { color: var(--ink); text-decoration-color: var(--cyan); }

/* news, ideas */
.botbox { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 24px; align-items: center; }
.qr { width: 168px; height: 168px; image-rendering: pixelated; background: #fff; padding: 10px; border-radius: 6px; }
.news { display: grid; grid-template-columns: minmax(0, 0.8fr) minmax(0, 1fr); gap: 28px; align-items: start; }
.news img { width: 100%; border-radius: 6px; border: 1px solid var(--line); }
.feed { display: flex; flex-direction: column; }
.item { display: grid; grid-template-columns: 150px minmax(0, 1fr) auto; gap: 20px; padding: 20px 0; border-top: 1px solid var(--line); align-items: start; }
.item .when { font: 500 11px/1.5 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--gold); }
.item h3 { margin: 0 0 6px; font-family: var(--display); font-weight: 400; font-size: 25px; line-height: 1.15; }
.item p { margin: 0; color: var(--ink-soft); max-width: 66ch; white-space: pre-line; }
.item img { margin-top: 10px; max-height: 280px; border-radius: 6px; border: 1px solid var(--line); }
.events { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); }
.event { background: var(--surface); border: 1px solid var(--line); border-top: 2px solid var(--cyan); border-radius: 6px; padding: 16px; display: flex; flex-direction: column; gap: 6px; }
.event .d { font: 400 40px/1 var(--display); color: var(--cyan); font-variant-numeric: tabular-nums; }
.event .m { font: 500 11px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--gold); }
.event h3 { margin: 4px 0 0; font-weight: 600; font-size: 16px; }
.event p { margin: 0; font-size: 13.5px; color: var(--ink-soft); }
.photos { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
figure { margin: 0; display: flex; flex-direction: column; gap: 6px; }
figure img { width: 100%; aspect-ratio: 3 / 4; object-fit: cover; border-radius: 6px; }
figcaption { font-size: 13px; color: var(--ink-soft); }
video { width: 100%; border-radius: 6px; background: #000; }
.qitem { display: grid; grid-template-columns: 96px minmax(0, 1fr) auto; gap: 16px; padding: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; align-items: start; }
.qitem img, .qitem .ph { width: 96px; height: 96px; object-fit: cover; border-radius: 4px; background: #10173a; }
.qitem h3 { margin: 0 0 4px; font-size: 16px; font-weight: 600; }
.qitem p { margin: 4px 0 0; font-size: 13.5px; color: var(--ink-soft); white-space: pre-line; }
.qitem .row { flex-direction: column; align-items: stretch; }
.foot { border-top: 1px solid var(--line); padding-top: 22px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 14px; font-size: 13px; color: var(--ink-soft); }
.foot nav { display: flex; flex-wrap: wrap; gap: 14px; }
.foot::before { content: ""; flex-basis: 100%; height: 24px; background: var(--orn) repeat-x center / 48px 24px; opacity: .6; }
.toast { left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); padding: 11px 16px; font-size: 14px; z-index: 30; max-width: calc(100% - 32px); }

/* ---------- futuristic layer: neon edges, HUD brackets, ornament corners ---------- */
body.page { background:
  linear-gradient(rgba(95,212,230,.035) 1px, transparent 1px) 0 0 / 44px 44px,
  linear-gradient(90deg, rgba(95,212,230,.035) 1px, transparent 1px) 0 0 / 44px 44px,
  radial-gradient(1200px 600px at 85% -10%, rgba(95,212,230,.10), transparent 60%),
  radial-gradient(900px 500px at -10% 10%, rgba(224,178,90,.08), transparent 60%), var(--bg); background-attachment: fixed; }
body.page .topbar::after { content: ""; position: absolute; left: 0; right: 0; bottom: -10px; height: 20px; background: var(--orn) repeat-x center / 40px 20px; opacity: .5; pointer-events: none; }
.head h1, .ptitle { background: linear-gradient(100deg, #fff 10%, #ece9f6 45%, var(--cyan) 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
.tile, .pcard, .scard, .steps li, .event, .rank a, .qitem, .banner {
  position: relative; background: linear-gradient(160deg, rgba(25,31,58,.92), rgba(13,16,32,.92));
  box-shadow: inset 0 1px 0 rgba(255,255,255,.05), 0 18px 40px -30px rgba(0,0,0,.9); }
.tile::before, .scard::before, .panel::before, .final::before {
  content: ""; position: absolute; top: 5px; left: 5px; width: 30px; height: 30px; background: var(--orn-corner) no-repeat 0 0 / 30px 30px; opacity: .7; pointer-events: none; }
.tile::after, .pcard::after, .scard::after, .panel::after, .final::after {
  content: ""; position: absolute; right: -1px; bottom: -1px; width: 16px; height: 16px; border-right: 2px solid var(--cyan); border-bottom: 2px solid var(--cyan); border-bottom-right-radius: 6px; opacity: .6; pointer-events: none; transition: opacity .2s, filter .2s; }

.scard > :first-child { margin-top: 10px; }
.tile:hover::after, .pcard:hover::after, .scard:hover::after { opacity: 1; filter: drop-shadow(0 0 6px var(--cyan)); }
.tile:hover, .scard:hover, .event:hover, .rank a:hover { box-shadow: 0 0 0 1px rgba(95,212,230,.22), 0 18px 44px -26px rgba(95,212,230,.45); }
.tile, .scard, .event, .rank a { transition: box-shadow .2s, border-color .2s; }
.btn { transition: box-shadow .2s, border-color .2s, color .2s, background .2s; }
.btn:hover { box-shadow: 0 0 0 1px rgba(95,212,230,.3), 0 0 22px -4px rgba(95,212,230,.55); }
.btn.solid { box-shadow: 0 0 24px -6px rgba(95,212,230,.75); }
.btn.gold:hover { color: var(--gold); border-color: var(--gold); box-shadow: 0 0 22px -4px rgba(224,178,90,.6); }
.stat b, .gcard .big, .event .d { text-shadow: 0 0 22px rgba(95,212,230,.45); }
.chip { box-shadow: 0 0 12px -4px currentColor; }
.nav a[aria-current="page"] { box-shadow: 0 0 18px -4px var(--cyan); }
.likebtn[aria-pressed="true"] { box-shadow: 0 0 16px -4px var(--gold); }
.ava { box-shadow: 0 0 0 3px rgba(224,178,90,.15), 0 0 24px -6px rgba(224,178,90,.6); }
.card { border-color: rgba(95,212,230,.22); box-shadow: 0 0 0 1px rgba(224,178,90,.08), 0 24px 60px -30px rgba(0,0,0,.9), inset 0 1px 0 rgba(255,255,255,.06); }
.panel .ptop, .final .eyebrow { padding-left: 30px; }
.final .eyebrow { padding-right: 30px; }
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(95,212,230,.15); outline: none; }
